name: CI
on:
  push: { branches: [main] }
  pull_request:
concurrency:
  # A newer push to a PR supersedes its running check. Every main commit runs on its own, in parallel,
  # because each one gates its own deploy.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: test }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      # The Python SDK tests start a real runtime.
      AGENT_TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: npm ci
      - run: pip install -r clients/python/requirements.txt
      - run: npm run typecheck
      - run: npm run test:python
      - run: npm run build:console && npm run build
  test:
    # Both hosting modes run the full suite side by side, each split over four shards balanced by
    # tests/timings.json (scripts/test-shard.ts). A 2-vCPU runner runs test files one at a time.
    name: test (${{ matrix.hosting }} ${{ matrix.shard }}/4)
    strategy:
      fail-fast: false
      matrix: { hosting: [process, inline], shard: [1, 2, 3, 4] }
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: test }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      # Every test that runs the runtime gets its own schema in this database.
      AGENT_TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/postgres
      AGENT_HOSTING: ${{ matrix.hosting }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run test:shard -- ${{ matrix.shard }}/4
  image:
    # The deployed image installs only runtime dependencies; prove it migrates its database, starts and serves,
    # with js_exec isolated in sandbox processes.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: test }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci && npm run build:console
      - uses: docker/setup-buildx-action@v3
      # Layers are cached across runs, so only changed stages (usually just src) rebuild.
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: agent-runtime:ci
          cache-from: type=gha,scope=image-amd64
          cache-to: type=gha,mode=max,scope=image-amd64
      - run: |
          docker run -d --name runtime --network host -e AGENT_RUNTIME_TOKEN=ci-boot-token-at-least-24-chars \
            -e AGENT_DATABASE_URL=postgres://postgres:test@127.0.0.1:5432/postgres agent-runtime:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8790/healthz; then
              docker logs runtime 2>&1 | grep '"type":"listening"' | grep -q '"sandbox":{"mode":"isolated"' && exit 0
              docker logs runtime; echo "js_exec is not running in sandbox processes"; exit 1
            fi
            sleep 1
          done
          docker logs runtime; exit 1
      - run: docker rm -f runtime
      # From inside a sandbox process: its uid, empty environment, seccomp filter and what it cannot reach;
      # then js_exec end to end, and a killed sandbox process restarted.
      - run: node --experimental-strip-types --disable-warning=ExperimentalWarning tests/image-isolation.ts
        env: { IMAGE: "agent-runtime:ci", DATABASE_URL: "postgres://postgres:test@127.0.0.1:5432/postgres" }
