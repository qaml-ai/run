name: CI
on:
  push: { branches: [main, camelfs/files-model] }
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  checks:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/node-dependencies
      - run: npm run typecheck
      - run: npm run test:ui

  v2:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/node-dependencies
      - uses: actions/setup-go@v5
        with: { go-version-file: v2/camelfsd/go.mod, cache-dependency-path: v2/camelfsd/go.sum }
      - name: Build v2 camelfsd binary for E2E tests
        working-directory: v2/camelfsd
        run: go build -o bin/camelfsd ./cmd/camelfsd
      - name: Install v2 dependencies
        working-directory: v2
        run: npm install --no-audit --no-fund
      - name: Typecheck and bundle v2 Worker
        working-directory: v2
        run: |
          npm run typecheck
          npm run build:worker
      - name: Run v2 Worker & Ingress E2E tests
        run: |
          XDG_CONFIG_HOME=/tmp/xdg WRANGLER_LOG_PATH=v2/.wrangler/logs \
            node --experimental-strip-types --disable-warning=ExperimentalWarning \
            --test --test-concurrency=1 --test-timeout=180000 v2/tests/*.test.ts

  camelfsd:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: camelfsd } }
    services:
      dynamodb:
        image: amazon/dynamodb-local@sha256:1856c05cc66a0e49dc1099e483ad2851477eeebe2135250ac11a1d1227db54b1
        ports: ["8000:8000"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: camelfsd/go.mod, cache-dependency-path: camelfsd/go.sum }
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - name: Wait for DynamoDB Local
        run: for i in $(seq 60); do curl -s --max-time 1 -o /dev/null http://127.0.0.1:8000 && exit 0; sleep 1; done; exit 1
      - run: go test ./...
        env: { CAMELFS_DDB_LOCAL: "http://127.0.0.1:8000" }
      - name: DynamoDB tests ran (not skipped)
        env: { CAMELFS_DDB_LOCAL: "http://127.0.0.1:8000" }
        run: |
          out=$(go test -count=1 -v ./internal/refstore/... 2>&1)
          if grep -q -- "--- SKIP" <<<"$out" || ! grep -q -- "--- PASS: TestCasRace" <<<"$out"; then echo "$out" | tail -40; exit 1; fi
          out=$(go test -count=1 -v -run TestDDBHostTierContract ./internal/computehost/ 2>&1)
          if grep -q -- "--- SKIP" <<<"$out" || ! grep -q -- "--- PASS: TestDDBHostTierContract" <<<"$out"; then echo "$out" | tail -40; exit 1; fi
      - run: go build -o "$RUNNER_TEMP/camelfsd" ./cmd/camelfsd
      - uses: ./.github/actions/node-dependencies
      - name: Real camelfsd contract
        working-directory: .
        env: { CAMELFS_DDB_LOCAL: "http://127.0.0.1:8000" }
        run: CAMELFSD_BIN="$RUNNER_TEMP/camelfsd" CAMELFS_CONTRACT_REQUIRED=1 node --experimental-strip-types --disable-warning=ExperimentalWarning --test tests/camelfs-contract.test.ts
      - name: Shared refs contract against a throwaway tier
        working-directory: .
        env: { CAMELFS_DDB_LOCAL: "http://127.0.0.1:8000" }
        run: CAMELFSD_BIN="$RUNNER_TEMP/camelfsd" node --experimental-strip-types --disable-warning=ExperimentalWarning tests/camelfs-refs-tier.ts
      - name: Node and Go guest compatibility
        working-directory: .
        run: |
          (cd camelfsd && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -tags guest -o "$RUNNER_TEMP/camelfsd-guest" ./cmd/camelfsd)
          tests=(tests/jobhost.test.ts tests/jobhost-camelfs*.test.ts tests/jobhost-host.test.ts)
          env -u CAMEL_GUEST_BIN node --experimental-strip-types --disable-warning=ExperimentalWarning --test "${tests[@]}"
          CAMEL_GUEST_BIN="$RUNNER_TEMP/camelfsd-guest" node --experimental-strip-types --disable-warning=ExperimentalWarning --test "${tests[@]}"

  ci:
    name: CI success
    timeout-minutes: 5
    if: always()
    needs: [checks, v2, camelfsd]
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks green
        env: { RESULTS: '${{ toJSON(needs) }}' }
        run: echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'
