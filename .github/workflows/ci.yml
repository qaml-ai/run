name: CI
on:
  push: { branches: [main] }
  pull_request:
concurrency:
  # A newer push to a PR supersedes its running check. Every main commit runs on its own, in parallel,
  # because each one gates its own deploy.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  checks:
    # The Python SDK tests start a real runtime, whose js_exec runs on the v8-exec job's binary.
    needs: v8-exec
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: test }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      # The Python SDK tests start a real runtime.
      AGENT_TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: v8-exec, path: sandbox/v8-exec/target/release }
      - run: chmod +x sandbox/v8-exec/target/release/v8-exec
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: npm ci
      - run: pip install -r clients/python/requirements.txt
      - run: npm run typecheck
      - run: npm run test:python
      - run: npm run test:ui
      - run: npm run build:console && npm run build
  test:
    # Both hosting modes run the full suite side by side, process hosting over six shards and inline (the faster,
    # though it alone runs the simulator's files) over five, balanced by tests/timings.json (scripts/test-shard.ts). A 4-vCPU runner runs three test files at
    # once. Each shard keeps its files' times as an artifact, to rebalance from. js_exec runs on v8-exec, built
    # once by the v8-exec job.
    name: test (${{ matrix.hosting }} ${{ matrix.shard }}/${{ matrix.hosting == 'process' && 6 || 5 }})
    needs: v8-exec
    strategy:
      fail-fast: false
      matrix:
        hosting: [process, inline]
        shard: [1, 2, 3, 4, 5, 6]
        exclude: [{ hosting: inline, shard: 6 }]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: test }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      # Every test that runs the runtime gets its own schema in this database.
      AGENT_TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/postgres
      AGENT_HOSTING: ${{ matrix.hosting }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/download-artifact@v4
        with: { name: v8-exec, path: sandbox/v8-exec/target/release }
      - run: chmod +x sandbox/v8-exec/target/release/v8-exec
      - run: npm ci
      # The service's 100 connections run out when a shard's busiest files run together (each test has its own pools):
      # raise them as the devbox's runs do. A service container takes no server flags, so set it and restart.
      - name: Postgres max_connections 300
        run: |
          id=$(docker ps -q --filter ancestor=postgres:16-alpine)
          docker exec "$id" psql -U postgres -c "alter system set max_connections = 300"
          docker restart "$id"
          until docker exec "$id" pg_isready -U postgres -h 127.0.0.1; do sleep 1; done
          docker exec "$id" psql -U postgres -tAc "show max_connections"
      - run: npm run test:shard -- ${{ matrix.shard }}/${{ matrix.hosting == 'process' && 6 || 5 }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with: { name: "test-timings-${{ matrix.hosting }}-${{ matrix.shard }}", path: test-timings/, retention-days: 30, if-no-files-found: ignore }
  sim:
    # The deterministic simulator (tests/sim, npm run sim): ten fixed seeds, each run twice and required to replay to the
    # same trace, and 50 fresh seeds drawn from the run's id. A failing seed prints the commands that reproduce it, and
    # its plan, history and logs are kept as the sim-failures artifact (npm run sim -- --replay <file>). Seeds are
    # CPU-bound and deterministic, so they run one process per vCPU.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: fixed seeds, twice each
        run: npm run -s sim -- --seeds 1-10 --twice --jobs 4
      - name: fresh seeds
        if: ${{ !cancelled() }}
        run: |
          from=$(( 100000 + (GITHUB_RUN_ID % 1000000) * 50 ))
          echo "seeds $from-$((from + 49)) (rerun one: npm run sim -- --seed <n>)"
          npm run -s sim -- --seeds $from-$((from + 49)) --jobs 4
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with: { name: sim-failures, path: sim-failures/, if-no-files-found: ignore }
  v8-exec:
    # js_exec's engine (sandbox/v8-exec), built here on x86_64 for the test shards, which run its tests
    # (seccomp included) and every js_exec suite on it; the image job builds and runs it on ARM64.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The binary itself, keyed by everything it is built from: a hit skips cargo altogether.
      - id: binary
        uses: actions/cache@v4
        with:
          path: sandbox/v8-exec/target/release/v8-exec
          key: v8-exec-binary-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('sandbox/v8-exec/Cargo.lock', 'sandbox/v8-exec/Cargo.toml', 'sandbox/v8-exec/rust-toolchain.toml', 'sandbox/v8-exec/src/**') }}
      # The toolchain is sandbox/v8-exec/rust-toolchain.toml's; rusty_v8's prebuilt V8 library is cached with the target dir.
      - if: steps.binary.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            sandbox/v8-exec/target
          key: v8-exec-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('sandbox/v8-exec/Cargo.lock', 'sandbox/v8-exec/rust-toolchain.toml') }}
      - if: steps.binary.outputs.cache-hit != 'true'
        run: cd sandbox/v8-exec && cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: v8-exec
          path: sandbox/v8-exec/target/release/v8-exec
          retention-days: 1
          if-no-files-found: error
  image:
    # The deployed image installs only runtime dependencies; prove it migrates its database, starts and serves,
    # with js_exec and file parsing confined by agent-launcher. Built natively for production's ARM64 (Graviton).
    runs-on: ubuntu-24.04-arm
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: test }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci && npm run build:console
      - uses: docker/setup-buildx-action@v3
      # Layers are cached across runs, so only changed stages (usually just src) rebuild.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          provenance: false
          load: true
          tags: agent-runtime:ci
          cache-from: type=gha,scope=image-arm64
          cache-to: type=gha,mode=max,scope=image-arm64
      - run: |
          mkdir -p /tmp/ci-tenants && chmod 755 /tmp/ci-tenants
          echo '{"tenants":{"ci":{"tokenSha256":"'"$(printf %s ci-boot-token-at-least-32-characters | sha256sum | cut -d' ' -f1)"'"}}}' > /tmp/ci-tenants/tenants.json
          docker run -d --name runtime --network host -v /tmp/ci-tenants:/etc/agent-runtime:ro -e AGENT_TENANTS_FILE=/etc/agent-runtime/tenants.json \
            -e AGENT_SESSION_SECRET=ci-boot-session-secret-at-least-32-chars -e AGENT_DATABASE_URL=postgres://postgres:test@127.0.0.1:5432/postgres agent-runtime:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8790/healthz; then
              docker logs runtime 2>&1 | grep '"type":"listening"' | grep -q '"sandbox":{"mode":"isolated"' && exit 0
              docker logs runtime; echo "js_exec is not running confined"; exit 1
            fi
            sleep 1
          done
          docker logs runtime; exit 1
      - run: docker rm -f runtime
      # From inside a parse job: its uid, empty environment, seccomp filter and what it cannot reach;
      # then js_exec end to end (a v8-exec process with a uid of its own, the launcher's filter and its own),
      # and every confined process killed, with js_exec and parsing still serving.
      - run: node --experimental-strip-types --disable-warning=ExperimentalWarning tests/image-isolation.ts
        env: { IMAGE: "agent-runtime:ci", DATABASE_URL: "postgres://postgres:test@127.0.0.1:5432/postgres" }
      # And the image's v8-exec on ARM64, seccomp included, as the node user.
      - run: docker run --rm --user node --entrypoint node -v "$PWD:/w:ro" -w /w agent-runtime:ci --experimental-strip-types --disable-warning=ExperimentalWarning --test --test-timeout=300000 tests/v8-exec.test.ts
  publish:
    # Main's production image goes to ECR while the tests run, from the layers the image job caches, so the
    # deploy (which waits for all of CI) only rolls it out. The deploy role trusts only the production
    # environment. Tags are immutable: a re-run finds its image already pushed.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-west-2
      - id: image
        run: |
          echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          if aws ecr describe-images --repository-name camelai-agent-runtime --image-ids imageTag="${GITHUB_SHA::12}" >/dev/null 2>&1; then
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.image.outputs.pushed != 'true'
        uses: actions/checkout@v4
      - if: steps.image.outputs.pushed != 'true'
        uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - if: steps.image.outputs.pushed != 'true'
        run: npm ci && npm run build:console
      - if: steps.image.outputs.pushed != 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - if: steps.image.outputs.pushed != 'true'
        uses: docker/setup-buildx-action@v3
      - if: steps.image.outputs.pushed != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          provenance: false
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/camelai-agent-runtime:${{ steps.image.outputs.tag }}
          cache-from: type=gha,scope=image-arm64
