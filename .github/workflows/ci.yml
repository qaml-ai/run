name: CI
on:
  push: { branches: [main] }
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  changes:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: filter
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            range="$base...HEAD"
          else
            base="${{ github.event.before }}"
            range="$base..$GITHUB_SHA"
          fi
          if [[ -z "$base" || "$base" == "0000000000000000000000000000000000000000" ]]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "$range" 2>/dev/null) || { echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; }
          if [[ -z "$files" ]]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          while IFS= read -r f; do
            [[ -z "$f" ]] && continue
            if [[ "$f" == docs/* ]]; then
              continue
            fi
            if [[ "$f" == *.md && "/$f" != */tests/* ]]; then
              continue
            fi
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          done <<< "$files"
          echo "Docs-only change detected; skipping heavy CI jobs."
          echo "code=false" >> "$GITHUB_OUTPUT"

  checks:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/node-dependencies
      - run: npm run typecheck
      - run: npm run test:ui
      - name: Run zero-dependency jobhost unit tests
        run: node --experimental-strip-types --disable-warning=ExperimentalWarning --test tests/jobhost-attest.test.ts tests/jobhost-scaler.test.ts

  v2-build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/node-dependencies
      - uses: actions/cache@v4
        id: v2-deps
        with:
          path: v2/node_modules
          key: v2-node-modules-${{ runner.os }}-${{ runner.arch }}-22-${{ hashFiles('v2/package-lock.json', 'v2/package.json') }}
      - if: steps.v2-deps.outputs.cache-hit != 'true'
        name: Install v2 dependencies
        working-directory: v2
        run: npm ci --no-audit --no-fund
      - uses: actions/setup-go@v5
        with: { go-version-file: v2/camelfsd/go.mod, cache-dependency-path: v2/camelfsd/go.sum }
      - name: Lint, test, and build v2 camelfsd
        working-directory: v2/camelfsd
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
          go build -o bin/camelfsd ./cmd/camelfsd
      - name: Build console SPA
        run: npm run build:console
      - name: Typecheck and bundle v2 Workers and SDK
        working-directory: v2
        run: |
          npm run typecheck
          npm run build:worker
          npm run build:ingress
          npm run build:svg-renderer
          npm run build:codemode-sandbox
          XDG_CONFIG_HOME=/tmp/xdg WRANGLER_LOG_PATH=.wrangler/logs \
            npx wrangler deploy --dry-run -c worker/wrangler.production.jsonc --outdir dist/worker-prod
          wasm_count=$(find dist/worker dist/worker-prod -name '*.wasm' | wc -l)
          echo "worker wasm count: $wasm_count"
          test "$wasm_count" -eq 0
          (cd sdk && npm run build)

  v2-tests:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/node-dependencies
      - uses: actions/cache@v4
        id: v2-deps
        with:
          path: v2/node_modules
          key: v2-node-modules-${{ runner.os }}-${{ runner.arch }}-22-${{ hashFiles('v2/package-lock.json', 'v2/package.json') }}
      - if: steps.v2-deps.outputs.cache-hit != 'true'
        name: Install v2 dependencies
        working-directory: v2
        run: npm ci --no-audit --no-fund
      - uses: actions/setup-go@v5
        with: { go-version-file: v2/camelfsd/go.mod, cache-dependency-path: v2/camelfsd/go.sum }
      - name: Build v2 camelfsd
        working-directory: v2/camelfsd
        run: go build -o bin/camelfsd ./cmd/camelfsd
      - name: Run v2 Worker & Ingress E2E tests (shard ${{ matrix.shard }}/4)
        run: |
          XDG_CONFIG_HOME=/tmp/xdg WRANGLER_LOG_PATH=v2/.wrangler/logs \
            node --experimental-strip-types --disable-warning=ExperimentalWarning \
            --test --test-shard=${{ matrix.shard }}/4 --test-concurrency=1 --test-timeout=180000 v2/tests/*.test.ts

  camelfsd:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: camelfsd } }
    services:
      dynamodb:
        image: amazon/dynamodb-local@sha256:1856c05cc66a0e49dc1099e483ad2851477eeebe2135250ac11a1d1227db54b1
        ports: ["8000:8000"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: camelfsd/go.mod, cache-dependency-path: camelfsd/go.sum }
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - name: Wait for DynamoDB Local
        run: for i in $(seq 60); do curl -s --max-time 1 -o /dev/null http://127.0.0.1:8000 && exit 0; sleep 1; done; exit 1
      - name: Run Go tests (including DynamoDB)
        env: { CAMELFS_DDB_LOCAL: "http://127.0.0.1:8000" }
        run: |
          set -o pipefail
          go test -count=1 -v ./... | tee /tmp/go-test.log
          if grep -q -- "CAMELFS_DDB_LOCAL is unset" /tmp/go-test.log \
            || grep -qE -- "--- SKIP: (TestCas|TestAcquire|TestExpiry|TestApplyMark|TestDDBHostTierContract)" /tmp/go-test.log \
            || ! grep -q -- "--- PASS: TestCasRace" /tmp/go-test.log \
            || ! grep -q -- "--- PASS: TestDDBHostTierContract" /tmp/go-test.log; then
            echo "Required DynamoDB tests were skipped or did not pass!"
            grep -E -- "--- (SKIP|FAIL|PASS): (TestCas|TestAcquire|TestExpiry|TestApplyMark|TestDDBHostTierContract)" /tmp/go-test.log || true
            exit 1
          fi
      - run: go build -o "$RUNNER_TEMP/camelfsd" ./cmd/camelfsd
      - uses: ./.github/actions/node-dependencies
      - name: Real camelfsd contract
        working-directory: .
        env: { CAMELFS_DDB_LOCAL: "http://127.0.0.1:8000" }
        run: CAMELFSD_BIN="$RUNNER_TEMP/camelfsd" CAMELFS_CONTRACT_REQUIRED=1 node --experimental-strip-types --disable-warning=ExperimentalWarning --test tests/camelfs-contract.test.ts
      - name: Shared refs contract against a throwaway tier
        working-directory: .
        env: { CAMELFS_DDB_LOCAL: "http://127.0.0.1:8000" }
        run: CAMELFSD_BIN="$RUNNER_TEMP/camelfsd" node --experimental-strip-types --disable-warning=ExperimentalWarning tests/camelfs-refs-tier.ts
      - name: Node and Go guest compatibility
        working-directory: .
        run: |
          (cd camelfsd && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -tags guest -o "$RUNNER_TEMP/camelfsd-guest" ./cmd/camelfsd)
          tests=(tests/jobhost.test.ts tests/jobhost-camelfs*.test.ts tests/jobhost-host.test.ts)
          env -u CAMEL_GUEST_BIN node --experimental-strip-types --disable-warning=ExperimentalWarning --test "${tests[@]}"
          CAMEL_GUEST_BIN="$RUNNER_TEMP/camelfsd-guest" node --experimental-strip-types --disable-warning=ExperimentalWarning --test "${tests[@]}"

  ci:
    name: CI success
    timeout-minutes: 5
    if: always()
    needs: [changes, checks, v2-build, v2-tests, camelfsd]
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks green
        env: { RESULTS: '${{ toJSON(needs) }}' }
        run: echo "$RESULTS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")'
