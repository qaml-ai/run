name: Nightly
# The deep runs of what pull requests check briefly. Property tests (tests/prop-*.test.ts, fast-check) run on every PR
# at their own small run counts, inside the test shards; here every one runs PROP_SCALE times as many. A failure prints
# its seed, path and the command that replays it (tests/prop-helpers.ts). Any suite added later that reads PROP_SCALE
# (or wants a nightly-only job) belongs in this file as another job.
on:
  schedule: [{ cron: "17 6 * * *" }]
  workflow_dispatch:
    inputs:
      scale: { description: "PROP_SCALE: multiplier on each property's PR run count", default: "100" }
      seed: { description: "PROP_SEED: replay one seed (with path)", default: "" }
      path: { description: "PROP_PATH: the failing path fast-check printed", default: "" }
      replay_path: { description: "PROP_REPLAY_PATH: a command sequence's replay path, from the printed replay command", default: "" }
permissions:
  contents: read
concurrency: { group: nightly, cancel-in-progress: false }
jobs:
  hosting:
    name: full hosting (${{ matrix.hosting }} ${{ matrix.shard }}/5)
    runs-on: blacksmith-16vcpu-ubuntu-2404
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        hosting: [inline, process]
        shard: [1, 2, 3, 4, 5]
    env:
      AGENT_HOSTING: ${{ matrix.hosting }}
      TEST_MODE_SCOPE: full
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/node-dependencies
      - uses: ./.github/actions/v8-exec
      - name: Start test Postgres
        id: postgres
        uses: ./.github/actions/test-postgres
      - run: npm run test:shard -- ${{ matrix.shard }}/5
        env:
          TEST_DATABASE_PER_FILE: "true"
          TEST_CONCURRENCY: "8"
          AGENT_TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:${{ steps.postgres.outputs.port }}/postgres
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with: { name: "nightly-test-timings-${{ matrix.hosting }}-${{ matrix.shard }}", path: test-timings/, retention-days: 14 }
      - name: Stop test Postgres
        if: always() && steps.postgres.outputs.container != ''
        run: docker rm -f '${{ steps.postgres.outputs.container }}'
  properties:
    runs-on: ${{ fromJSON(github.ref == 'refs/heads/main' && vars.CI_RUNNER_LABELS || '["ubuntu-latest"]') }}
    timeout-minutes: 90
    services:
      postgres:
        # Hosted runners have a Docker Hub pull-limit exemption; ECR Public can throttle them.
        image: ${{ github.ref == 'refs/heads/main' && contains(fromJSON(vars.CI_RUNNER_LABELS || '["ubuntu-latest"]'), 'self-hosted') && 'public.ecr.aws/docker/library/postgres:16-alpine' || 'postgres:16-alpine' }}
        env: { POSTGRES_PASSWORD: test }
        ports: ["127.0.0.1::5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      PROP_SCALE: ${{ inputs.scale || '100' }}
      PROP_SEED: ${{ inputs.seed }}
      PROP_PATH: ${{ inputs.path }}
      PROP_REPLAY_PATH: ${{ inputs.replay_path }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      # An empty PROP_SEED (a scheduled run) means a fresh seed per property.
      # The shared host has 16 vCPUs; keep file concurrency within this job's resource budget.
      - run: node --experimental-strip-types --disable-warning=ExperimentalWarning --test --test-concurrency=2 --test-timeout=3600000 tests/prop-*.test.ts
        env:
          AGENT_TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres
