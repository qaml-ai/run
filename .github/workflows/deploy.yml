name: Deploy
# Every main commit that passes CI rolls out to the ECS service; run it by hand to redeploy.
# The job runs in the `production` environment: add required reviewers there to gate deploys.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
concurrency:
  # One rollout at a time, in order; a queued deploy is never cancelled half-way.
  group: deploy-production
  cancel-in-progress: false
permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment: production
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        # Full history, to tell whether production already runs a newer commit.
        with: { ref: "${{ env.SHA }}", fetch-depth: 0 }
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-west-2
      # CI runs finish out of order, so a green run can arrive after a newer commit already shipped: skip it
      # rather than roll production back (run the workflow by hand to roll back on purpose).
      # CI's publish job pushes every main commit's image; build here only when it is missing, as for a
      # hand-run redeploy of a commit from before that job existed.
      - id: image
        run: |
          echo "tag=${SHA::12}" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then
            definition=$(aws ecs describe-services --cluster camelai-agent-runtime --services camelai-agent-runtime --query 'services[0].taskDefinition' --output text)
            live=$(aws ecs describe-task-definition --task-definition "$definition" --query 'taskDefinition.containerDefinitions[0].image' --output text)
            live=${live##*:}
            if [ "$live" != "${SHA::12}" ] && git merge-base --is-ancestor "$SHA" "$live" 2>/dev/null; then
              echo "::notice::Production already runs $live, which includes ${SHA::12}; not deploying"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          if ! aws ecr describe-images --repository-name camelai-agent-runtime --image-ids imageTag="${SHA::12}" >/dev/null 2>&1; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.image.outputs.build == 'true'
        uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - if: steps.image.outputs.build == 'true'
        run: npm ci && npm run build:console
      - if: steps.image.outputs.build == 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      # Production is ARM64 (Graviton); build under emulation with CI's layer cache, so usually only src rebuilds.
      - if: steps.image.outputs.build == 'true'
        uses: docker/setup-qemu-action@v3
        with: { platforms: arm64, image: "mirror.gcr.io/tonistiigi/binfmt:latest" }
      - if: steps.image.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3
        with: { driver-opts: "image=mirror.gcr.io/moby/buildkit:buildx-stable-1" }
      - if: steps.image.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          provenance: false
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/camelai-agent-runtime:${{ steps.image.outputs.tag }}
          cache-from: type=gha,scope=image-arm64
      - if: steps.image.outputs.skip != 'true'
        run: infra/ecs-deploy.sh "${{ steps.image.outputs.tag }}"
