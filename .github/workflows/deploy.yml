name: Deploy
# Every main commit that passes CI rolls out to the ECS service; run it by hand to redeploy.
# The job runs in the `production` environment: add required reviewers there to gate deploys.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
concurrency:
  # One rollout at a time, in order; a queued deploy is never cancelled half-way.
  group: deploy-production
  cancel-in-progress: false
permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment: production
    env:
      SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.SHA }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci && npm run build:console
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-west-2
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - run: echo "tag=${SHA::12}" >> "$GITHUB_OUTPUT"
        id: tag
      # Production is ARM64 (Graviton); build under emulation with a layer cache, so usually only src rebuilds.
      - uses: docker/setup-qemu-action@v3
        with: { platforms: arm64 }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          provenance: false
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/camelai-agent-runtime:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=image-arm64
          cache-to: type=gha,mode=max,scope=image-arm64
      - run: infra/ecs-deploy.sh "${{ steps.tag.outputs.tag }}"
