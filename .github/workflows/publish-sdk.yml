name: Publish SDK
# Push a tag like sdk-v0.10.0 (matching sdk/package.json), on a commit already on main, to publish the
# TypeScript release train to npmjs: @camelai/agent-runtime first, then @camelai/agent-runtime-react,
# -vue, -svelte, -solid and @camelai/create-agent-app. They share one version and depend on exactly
# this core (the shadcn registry installs exactly it too); each is built after sdk/dist, which its types
# come from. A version already on npm is skipped, so a failed run can be run again.
#
# Authentication is npm trusted publishing (GitHub OIDC); no npm token is stored anywhere. Each package
# trusts this workflow file in the `npm` environment. The repository is private, so npm records no
# provenance for these releases. Add required reviewers to the `npm` environment in GitHub to gate
# releases on an approval.
#
# FIRST PUBLISH of a new package (npm trust answers 404 for a package that does not exist yet), once,
# by an owner of the @camelai scope, in this order:
#   1. a 0.0.0 placeholder of each new package is on npm (published by hand, with 2FA)
#   2. npm trust github <package> --repo qaml-ai/agent-runtime --file publish-sdk.yml --env npm --allow-publish
#      for @camelai/agent-runtime-react, -vue, -svelte, -solid and @camelai/create-agent-app
#      (the core already trusts this workflow)
#   3. push the tag: git tag sdk-v0.10.0 <commit on main> && git push origin sdk-v0.10.0
on:
  push: { tags: ["sdk-v*"] }
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: test }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 20
    env:
      AGENT_TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:5432/postgres
      # A private repository: no provenance statement is made.
      NPM_CONFIG_PROVENANCE: "false"
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # Only what main has: a tag on a branch's commit publishes nothing.
      - name: Tagged commit is on main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      # No registry-url: that writes an .npmrc with a token (a placeholder), which npm then warns of as a token that
      # bypasses 2FA. Trusted publishing needs none; npm publishes to the public registry by default.
      - uses: actions/setup-node@v4
        # Node 24: the npm below needs a newer Node 22 than setup-node may pick.
        with: { node-version: 24, cache: npm }
      # Trusted publishing needs npm 11.5.1 or later; pinned, so a release never runs an npm it was not tried with.
      - run: npm install -g npm@11.20.0
      - run: npm ci
      # The tag names the train's version, and every package (and the registry) is at it, on exactly this core.
      - name: Check versions
        run: |
          version="$(node -p 'require("./sdk/package.json").version')"
          test "sdk-v$version" = "$GITHUB_REF_NAME"
          for dir in packages/react packages/vue packages/svelte packages/solid packages/create-agent-app; do
            node -e '
              const [dir, version] = process.argv.slice(1);
              const manifest = require(`./${dir}/package.json`);
              const core = manifest.dependencies?.["@camelai/agent-runtime"];
              if (manifest.version !== version || (core !== undefined && core !== version)) {
                console.error(`${manifest.name}: ${manifest.version}, core ${core}; expected ${version}`); process.exit(1);
              }' "$dir" "$version"
          done
          node -e '
            const version = process.argv[1];
            for (const item of require("./packages/registry/registry.json").items)
              for (const dependency of item.dependencies ?? [])
                if (dependency.startsWith("@camelai/") && !dependency.endsWith(`@${version}`)) { console.error(`registry ${item.name}: ${dependency}`); process.exit(1); }
          ' "$version"
          node --experimental-strip-types --disable-warning=ExperimentalWarning packages/registry/build.ts --check
      - run: npm run typecheck
      - run: npm run test:ui
      # The SDK's and the frontend's node tests, against a real runtime.
      - run: node --experimental-strip-types --test --test-timeout=120000 tests/ui-*.test.ts tests/sdk-*.test.ts tests/clients.test.ts tests/watch.test.ts tests/browser-tokens.test.ts
      # Core first: the others depend on this exact version being on npm.
      - name: Publish
        run: |
          publish() {
            name="$(node -p "require('./$1/package.json').name")"; version="$(node -p "require('./$1/package.json').version")"
            if npm view "$name@$version" version >/dev/null 2>&1; then echo "$name@$version is already published"; return; fi
            (cd "$1" && npm publish)
          }
          (cd sdk && npm run build)
          publish sdk
          for dir in packages/react packages/vue packages/svelte packages/solid packages/create-agent-app; do publish "$dir"; done
