name: Publish Python SDK
# Push a tag like py-v0.2.0 (matching clients/python/pyproject.toml) to publish
# camelai-run to PyPI. Authentication is PyPI trusted publishing (GitHub OIDC):
# the project trusts this workflow file in the `pypi` environment; no token is stored anywhere.
on:
  push: { tags: ["py-v*"] }
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: test "py-v$(python -c 'import tomllib; print(tomllib.load(open("clients/python/pyproject.toml", "rb"))["project"]["version"])')" = "$GITHUB_REF_NAME"
      - run: python -m pip install build==1.3.0 && python -m build clients/python --outdir dist
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/ }
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@release/v1
