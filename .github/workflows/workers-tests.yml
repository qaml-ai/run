name: Workers tests
# The experimental Workers backend (backends/workers). Not part of CI's required checks and never gates the ECS deploy.
# It runs only when something the Workers code imports can change: its own tree, the shared runtime source it imports
# (most of src/, but not admin, channels, voice or the console's sign-in), the SDK clients, the contract suite and
# test helpers, the CLI source the hosted MCP server is generated from, migrations and dependencies. Keep this list in
# step with backends/workers' imports and generators (scripts/reuse-*.mjs).
on:
  push:
    branches: [main]
    paths:
      - backends/workers/**
      - src/**
      - "!src/admin-*.ts"
      - "!src/channels*.ts"
      - "!src/voice/**"
      - "!src/voice-*.ts"
      - "!src/console-auth.ts"
      - "!src/oauth.ts"
      - "!src/help*.ts"
      - "!src/ops-*.ts"
      - "!src/email-accounts.ts"
      - clients/*.ts
      - packages/cli/src/**
      - shared/**
      - tests/contract/**
      - tests/database.ts
      - tests/fake-launcher.ts
      - tests/file-fixtures.ts
      - tests/runtime-server.ts
      - tests/event-transport.test.ts
      - migrations/**
      - openapi.json
      - package.json
      - package-lock.json
      - .github/workflows/workers-tests.yml
      - .github/actions/**
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - backends/workers/**
      - src/**
      - "!src/admin-*.ts"
      - "!src/channels*.ts"
      - "!src/voice/**"
      - "!src/voice-*.ts"
      - "!src/console-auth.ts"
      - "!src/oauth.ts"
      - "!src/help*.ts"
      - "!src/ops-*.ts"
      - "!src/email-accounts.ts"
      - clients/*.ts
      - packages/cli/src/**
      - shared/**
      - tests/contract/**
      - tests/database.ts
      - tests/fake-launcher.ts
      - tests/file-fixtures.ts
      - tests/runtime-server.ts
      - tests/event-transport.test.ts
      - migrations/**
      - openapi.json
      - package.json
      - package-lock.json
      - .github/workflows/workers-tests.yml
      - .github/actions/**
  # The slow job runs nightly and on demand (Run workflow with slow: true).
  schedule: [{ cron: "47 6 * * *" }]
  workflow_dispatch:
    inputs:
      slow: { description: "Run only the slow tests (WORKERS_SLOW_TESTS=1) instead of the suites", type: boolean, default: false }
permissions:
  contents: read
concurrency:
  group: workers-tests-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'schedule' || inputs.slow == true }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    name: Workers ${{ matrix.suite }}${{ matrix.shard && format(' (shard {0}/3)', matrix.shard) || '' }}
    if: github.event_name != 'schedule' && inputs.slow != true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: unit
            command: test
          - suite: integration
            command: test:integration
            shard: 1
          - suite: integration
            command: test:integration
            shard: 2
          - suite: integration
            command: test:integration
            shard: 3
    steps:
      - uses: actions/checkout@v4
      # Tests also import the shared src/ code and the repository SDK.
      - uses: ./.github/actions/node-dependencies
      - uses: actions/cache@v4
        id: workers-dependencies
        with:
          path: backends/workers/node_modules
          key: workers-node-modules-${{ runner.os }}-${{ runner.arch }}-22-${{ hashFiles('backends/workers/package-lock.json', 'backends/workers/package.json', 'backends/workers/.npmrc') }}
      - if: steps.workers-dependencies.outputs.cache-hit != 'true'
        run: npm ci
        working-directory: backends/workers
      - uses: docker/setup-buildx-action@v3
        if: matrix.suite == 'integration'
      - name: Check local Docker for native computer fixtures
        if: matrix.suite == 'integration'
        run: docker info --format '{{.ServerVersion}}' && docker buildx version
      # Generated copies of src/ (scripts/reuse-*.mjs, scripts/port-*-tests.mjs) must match what their scripts write.
      - name: Check generated copies of src/
        if: matrix.suite == 'unit'
        run: npm run check:reuse
        working-directory: backends/workers
      - name: Start test Postgres
        id: postgres
        uses: ./.github/actions/test-postgres
      - name: Run Workers ${{ matrix.suite }} suite
        run: npm run ${{ matrix.command }}${{ matrix.shard && format(' -- --test-shard={0}/3', matrix.shard) || '' }}
        working-directory: backends/workers
        env:
          AGENT_TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:${{ steps.postgres.outputs.port }}/postgres
          WRANGLER_SEND_METRICS: "false"
          WORKERS_REQUIRE_DOCKER: ${{ matrix.suite == 'integration' && '1' || '0' }}
      - name: Stop test Postgres
        if: always() && steps.postgres.outputs.container != ''
        run: docker rm -f '${{ steps.postgres.outputs.container }}'

  # Tests too slow for every pull request, each read from WORKERS_SLOW_TESTS: today the account deletion test at 2001
  # agents and 81 deletion passes (the suites run it at 101 agents), about 8.5 minutes on a Sprite.
  slow:
    name: Workers slow tests
    if: github.event_name == 'schedule' || inputs.slow == true
    # The 2001-agent deletion test has timed out on 2-vCPU runners; nightly only, so the bigger runner costs little.
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/node-dependencies
      - uses: actions/cache@v4
        id: workers-dependencies
        with:
          path: backends/workers/node_modules
          key: workers-node-modules-${{ runner.os }}-${{ runner.arch }}-22-${{ hashFiles('backends/workers/package-lock.json', 'backends/workers/package.json', 'backends/workers/.npmrc') }}
      - if: steps.workers-dependencies.outputs.cache-hit != 'true'
        run: npm ci
        working-directory: backends/workers
      - name: Start test Postgres
        id: postgres
        uses: ./.github/actions/test-postgres
      - name: Run the slow tests
        run: node --import ./test/compat-register.mjs --experimental-strip-types --test test/account-deletion.integration.ts
        working-directory: backends/workers
        env:
          WORKERS_SLOW_TESTS: "1"
          AGENT_TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:${{ steps.postgres.outputs.port }}/postgres
          WRANGLER_SEND_METRICS: "false"
          WORKERS_REQUIRE_DOCKER: "0"
      - name: Stop test Postgres
        if: always() && steps.postgres.outputs.container != ''
        run: docker rm -f '${{ steps.postgres.outputs.container }}'
