name: Workers tests
# The experimental Workers backend (backends/workers). Not part of CI's required checks and never gates the ECS deploy.
# It runs only when something the Workers code imports can change: its own tree, the shared runtime source it imports
# (most of src/, but not admin, channels, voice or the console's sign-in), the SDK clients, the contract suite and
# test helpers, migrations and dependencies. Keep this list in step with backends/workers' imports.
on:
  push:
    branches: [main]
    paths:
      - backends/workers/**
      - src/**
      - "!src/admin-*.ts"
      - "!src/channels*.ts"
      - "!src/voice/**"
      - "!src/voice-*.ts"
      - "!src/console-auth.ts"
      - "!src/oauth.ts"
      - "!src/help*.ts"
      - "!src/ops-*.ts"
      - "!src/discord-managed.ts"
      - "!src/email-accounts.ts"
      - clients/*.ts
      - shared/**
      - tests/contract/**
      - tests/database.ts
      - tests/fake-launcher.ts
      - tests/file-fixtures.ts
      - tests/runtime-server.ts
      - tests/event-transport.test.ts
      - migrations/**
      - openapi.json
      - package.json
      - package-lock.json
      - .github/workflows/workers-tests.yml
      - .github/actions/**
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - backends/workers/**
      - src/**
      - "!src/admin-*.ts"
      - "!src/channels*.ts"
      - "!src/voice/**"
      - "!src/voice-*.ts"
      - "!src/console-auth.ts"
      - "!src/oauth.ts"
      - "!src/help*.ts"
      - "!src/ops-*.ts"
      - "!src/discord-managed.ts"
      - "!src/email-accounts.ts"
      - clients/*.ts
      - shared/**
      - tests/contract/**
      - tests/database.ts
      - tests/fake-launcher.ts
      - tests/file-fixtures.ts
      - tests/runtime-server.ts
      - tests/event-transport.test.ts
      - migrations/**
      - openapi.json
      - package.json
      - package-lock.json
      - .github/workflows/workers-tests.yml
      - .github/actions/**
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: workers-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    name: Workers ${{ matrix.suite }}${{ matrix.shard && format(' (shard {0}/3)', matrix.shard) || '' }}
    runs-on: ${{ matrix.runner || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Integration shard 1 holds only the 2001-agent account deletion test (see weight in
        # backends/workers/scripts/run-tests.mjs): it needs a runner to itself to finish inside its 900 s timeout.
        include:
          - suite: unit
            command: test
          - suite: integration
            command: test:integration
            shard: 1
            # About 12 minutes of agent creation and deletion passes against a 15 minute timeout: it hung at the limit twice
            # on a 2 vCPU runner (and once on codex/workers-scale), so it gets a faster one.
            runner: blacksmith-4vcpu-ubuntu-2404
          - suite: integration
            command: test:integration
            shard: 2
          - suite: integration
            command: test:integration
            shard: 3
    steps:
      - uses: actions/checkout@v4
      # Tests also import the shared src/ code and the repository SDK.
      - uses: ./.github/actions/node-dependencies
      - uses: actions/cache@v4
        id: workers-dependencies
        with:
          path: backends/workers/node_modules
          key: workers-node-modules-${{ runner.os }}-${{ runner.arch }}-22-${{ hashFiles('backends/workers/package-lock.json', 'backends/workers/package.json', 'backends/workers/.npmrc') }}
      - if: steps.workers-dependencies.outputs.cache-hit != 'true'
        run: npm ci
        working-directory: backends/workers
      - uses: docker/setup-buildx-action@v3
        if: matrix.suite == 'integration'
      - name: Check local Docker for native computer fixtures
        if: matrix.suite == 'integration'
        run: docker info --format '{{.ServerVersion}}' && docker buildx version
      - name: Start test Postgres
        id: postgres
        uses: ./.github/actions/test-postgres
      - name: Run Workers ${{ matrix.suite }} suite
        run: npm run ${{ matrix.command }}${{ matrix.shard && format(' -- --test-shard={0}/3', matrix.shard) || '' }}
        working-directory: backends/workers
        env:
          AGENT_TEST_DATABASE_URL: postgres://postgres:test@127.0.0.1:${{ steps.postgres.outputs.port }}/postgres
          WRANGLER_SEND_METRICS: "false"
          WORKERS_REQUIRE_DOCKER: ${{ matrix.suite == 'integration' && '1' || '0' }}
      - name: Stop test Postgres
        if: always() && steps.postgres.outputs.container != ''
        run: docker rm -f '${{ steps.postgres.outputs.container }}'
