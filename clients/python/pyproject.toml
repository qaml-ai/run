[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "camelai-run"
version = "0.14.0"
description = "Python SDK for camelRun"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["httpx==0.28.1"]

[project.optional-dependencies]
# serve_tools, verify_runtime_token and TestRuntime check Ed25519 signatures.
server = ["cryptography>=42"]
# Structured output with a pydantic model (run(output=Model)); a JSON Schema dict needs nothing.
pydantic = ["pydantic>=2"]

[project.urls]
Homepage = "https://run.camelai.com"

[tool.setuptools]
packages = ["camelai_run"]

# The docs for coding agents, for this version: SKILL.md and sdk.md, copied from docs/ before a build
# (node scripts/package-docs.mjs clients/python/camelai_run).
[tool.setuptools.package-data]
camelai_run = ["*.md", "py.typed"]
