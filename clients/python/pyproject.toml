[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "camelai-run"
version = "0.7.1"
description = "Python SDK for camelRun"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["httpx==0.28.1"]

[project.optional-dependencies]
# serve_tools, verify_runtime_token and TestRuntime check Ed25519 signatures.
server = ["cryptography>=42"]

[project.urls]
Homepage = "https://run.camelai.com"

[tool.setuptools]
py-modules = ["camelai_run"]
