[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "camelai-agent-runtime"
version = "0.1.0"
description = "Python SDK for the camelAI hosted agent runtime"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["httpx==0.28.1"]

[project.optional-dependencies]
# serve_tools, verify_runtime_token and TestRuntime check Ed25519 signatures.
server = ["cryptography>=42"]

[project.urls]
Homepage = "https://agents.camelai.dev"

[tool.setuptools]
py-modules = ["camelai_agent_runtime"]
