[package]
name = "v8-exec"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
v8 = { version = "152.2.0", default-features = false, features = ["use_custom_libcxx"] }
oxc = { version = "=0.139.0", default-features = false, features = ["transformer", "codegen", "semantic"] }
serde_json = "1"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
