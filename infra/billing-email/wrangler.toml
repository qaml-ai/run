name = "camelrun-billing-email"
main = "worker.ts"
account_id = "85bbd288051330fb51ee1c86031a299b"
compatibility_date = "2026-09-29"
workers_dev = true
preview_urls = false

[vars]
FROM = "billing@mail.camelai.com"
FEEDBACK_URL = "https://agents.camelai.dev/v1/billing/email/feedback"
# Get Help: mail from SUPPORT_FROM (as camelStream sends support mail) must include SUPPORT_TO and reply there (worker.ts).
SUPPORT_FROM = "no-reply@mail.camelai.com"
SUPPORT_TO = "support@camelai.com"

[[send_email]]
name = "EMAIL"
allowed_sender_addresses = ["billing@mail.camelai.com", "no-reply@mail.camelai.com"]

[[queues.consumers]]
queue = "camelrun-billing-email-feedback"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 50
dead_letter_queue = "camelrun-billing-email-feedback-dlq"

[observability]
enabled = true
