openapi: 3.1.0
info:
  title: camelRun Workers repository ref updates
  version: "1"
paths:
  /v1/repos/{id}/refs/{name}:
    put:
      summary: Create or fast-forward a repository ref
      description: >-
        Updates to existing refs are fast-forward-only. Setting a ref to its current version
        succeeds without a change. Use POST /v1/repos/{id}/restore to restore an earlier
        version by creating a new commit.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version:
                  type: string
                expect:
                  type: [string, "null"]
      responses:
        "200":
          description: Ref created, fast-forwarded, or already at the requested version.
        "409":
          description: >-
            not_fast_forward if the target does not descend from the current version or the
            ancestry check exceeds 50,000 versions. Ref-moving writes that publish a new
            commit return bad_parent if it has an invalid first parent or parent count.
        "412":
          description: stale if the ref does not match the supplied expect value.
  /v1/repos/{id}/history:
    get:
      summary: Walk a ref's first-parent commit history
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: ref
          in: query
          required: true
          schema:
            type: string
        - name: after
          in: query
          description: Resume at the first parent of this reachable commit.
          schema:
            type: string
            pattern: '^[0-9a-f]{40}$'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
        - name: path
          in: query
          description: Include commits that changed this file or directory.
          schema:
            type: string
      responses:
        "200":
          description: First-parent history. The walk visits at most 10,000 commits per page.
          content:
            application/json:
              schema:
                type: object
                required: [versions, next]
                properties:
                  versions:
                    type: array
                    items:
                      type: object
                      required: [version, parents, author, message, trailers, time]
                      properties:
                        version: { type: string }
                        parents:
                          type: array
                          items: { type: string }
                        author: { type: string }
                        message: { type: string }
                        trailers:
                          type: object
                          additionalProperties: { type: string }
                        time:
                          type: integer
                          description: Unix time in seconds.
                  next:
                    type: [string, "null"]
                    description: Cursor to pass as after when more commits remain.
        "400":
          description: bad_ref for a missing or invalid ref, or bad_cursor for an invalid or unreachable commit.
        "404":
          description: Ref or repository not found.
        "413":
          description: Cursor ancestry could not be proven within the storage tier's walk limit.
